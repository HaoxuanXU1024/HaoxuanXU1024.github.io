<div id="fx-panel">
  <div class="fx-header">
    ✨ Effects Preview
    <span class="fx-close" onclick="document.getElementById('fx-panel').style.display='none'">✕</span>
  </div>
  
  <div class="fx-section-label">Cursor Trail</div>
  <div class="fx-row">
    <button class="fx-btn active" data-group="cursor" onclick="fxSelect('cursor',this); setCursorFx('trail')">
      <span class="fx-icon">〰️</span> Trail
    </button>
    <button class="fx-btn" data-group="cursor" onclick="fxSelect('cursor',this); setCursorFx('glow')">
      <span class="fx-icon">💡</span> Glow
    </button>
    <button class="fx-btn" data-group="cursor" onclick="fxSelect('cursor',this); setCursorFx('none')">
      <span class="fx-icon">🚫</span> None
    </button>
  </div>
  
  <div class="fx-section-label" style="margin-top: 10px;">Click Effect</div>
  <div class="fx-row">
    <button class="fx-btn active" data-group="click" onclick="fxSelect('click',this); setClickFx('sparkle')">
      <span class="fx-icon">✨</span> Sparkle
    </button>
    <button class="fx-btn" data-group="click" onclick="fxSelect('click',this); setClickFx('ring')">
      <span class="fx-icon">⭕</span> Ring
    </button>
    <button class="fx-btn" data-group="click" onclick="fxSelect('click',this); setClickFx('hearts')">
      <span class="fx-icon">♥️</span> Hearts
    </button>
  </div>
  
  <div style="margin-top: 10px; text-align: center; font-size: 10px; color: #9ca3af;">
    Move & click to preview effects
  </div>
</div>

<style>
#fx-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(255,255,255,0.92);
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  z-index: 10000;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  width: 250px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.fx-header {
  font-weight: 700;
  font-size: 13px;
  color: #1f2937;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.fx-close {
  cursor: pointer;
  color: #9ca3af;
  font-size: 14px;
  transition: color 0.2s;
}
.fx-close:hover { color: #374151; }
.fx-section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9ca3af;
  margin-bottom: 6px;
  font-weight: 600;
}
.fx-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.fx-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  cursor: pointer;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  background: rgba(255,255,255,0.8);
  transition: all 0.2s;
  font-size: 11px;
  font-weight: 500;
  color: #6b7280;
}
.fx-btn:hover { border-color: #93c5fd; transform: translateY(-1px); }
.fx-btn.active { border-color: #3b82f6; background: rgba(59,130,246,0.06); color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.fx-icon { font-size: 16px; }
</style>

<script>
function fxSelect(group, btn) {
  document.querySelectorAll('.fx-btn[data-group="' + group + '"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
