<div id="theme-switcher-panel" style="position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 10000; font-size: 13px; border: 1px solid #e0e0e0; backdrop-filter: blur(10px);">
  <div style="font-weight: 600; margin-bottom: 10px; text-align: center; color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px;">🎨 Live Theme Preview</div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button onclick="setTheme('grid')" style="padding: 8px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #4b5563; font-weight: 500; transition: all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">1. 致精学术 (Grid)</button>
    <button onclick="setTheme('canvas')" style="padding: 8px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #4b5563; font-weight: 500; transition: all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">2. 简约帆布 (Canvas)</button>
    <button onclick="setTheme('glass')" style="padding: 8px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; color: #4b5563; font-weight: 500; transition: all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">3. 现代磨砂 (Glass)</button>
  </div>
</div>

<script>
  function setTheme(theme) {
    const body = document.body;
    const blocks = document.querySelectorAll('.cv-block');
    if (theme === 'grid') {
      body.style.backgroundColor = '#fdfdfd';
      body.style.backgroundImage = 'radial-gradient(#e5e5e5 1px, transparent 1px)';
      body.style.backgroundSize = '25px 25px';
      blocks.forEach(b => {
        b.style.backgroundColor = 'rgba(255, 255, 255, 0.9)';
        b.style.backdropFilter = 'blur(8px)';
        b.style.border = '1px solid rgba(225, 228, 232, 0.5)';
        b.style.boxShadow = '0 8px 32px 0 rgba(31, 38, 135, 0.07)';
      });
    } else if (theme === 'canvas') {
      body.style.backgroundColor = '#f5f7f9';
      body.style.backgroundImage = 'none';
      blocks.forEach(b => {
        b.style.backgroundColor = '#ffffff';
        b.style.backdropFilter = 'none';
        b.style.border = '1px solid #e1e4e8';
        b.style.boxShadow = '0 2px 4px rgba(0,0,0,0.02)';
      });
    } else if (theme === 'glass') {
      body.style.backgroundColor = '#eef2f5';
      body.style.backgroundImage = 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)';
      blocks.forEach(b => {
        b.style.backgroundColor = 'rgba(255, 255, 255, 0.55)';
        b.style.backdropFilter = 'blur(16px)';
        b.style.border = '1px solid rgba(255, 255, 255, 0.4)';
        b.style.boxShadow = '0 8px 32px rgba(31, 38, 135, 0.1)';
      });
    }
  }
</script>
