<script src="assets/js/main.min.js"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<script>
(function() {
  if (window.innerWidth <= 768) return;

  /* ════════════════════════════════════════
     CURSOR: Soft Radial Glow
  ════════════════════════════════════════ */
  const glow = document.createElement('div');
  glow.style.cssText = `
    position: fixed; width: 250px; height: 250px; border-radius: 50%;
    pointer-events: none; z-index: 9998; opacity: 0;
    transition: opacity 0.4s ease;
    background: radial-gradient(circle, rgba(99,148,231,0.1) 0%, rgba(99,148,231,0.04) 40%, transparent 70%);
  `;
  document.body.appendChild(glow);

  window.addEventListener('mousemove', function(e) {
    glow.style.left = (e.clientX - 125) + 'px';
    glow.style.top  = (e.clientY - 125) + 'px';
    glow.style.opacity = '1';
  });
  document.addEventListener('mouseleave', function() { glow.style.opacity = '0'; });

  /* ════════════════════════════════════════
     CLICK: Sparkle Burst
  ════════════════════════════════════════ */
  document.addEventListener('click', function(e) {
    const colors = ['#6394e7', '#93b5f5', '#4a7de0', '#a8c4f7', '#7da8ef'];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'click-spark';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      const angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5) * 0.5;
      const dist = 18 + Math.random() * 28;
      s.style.left = e.clientX + 'px';
      s.style.top  = e.clientY + 'px';
      s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(s);
      setTimeout(function() { s.remove(); }, 600);
    }
  });

  /* ════════════════════════════════════════
     HOVER: Paragraph-level subtle feedback
     - Individual <p>, <li>, <div> inside content
       get a gentle rightward shift + soft
       background highlight on hover
  ════════════════════════════════════════ */

  // Target interactive text elements within content cards
  var selectors = [
    '.cv-block > p',
    '.cv-block > ul > li',
    '.cv-block > ol > li',
    '.paper-box-text > p',
    '.paper-box-text > ul > li',
    '.paper-box-text > ol > li',
    '.paper-box-text > div'
  ];

  document.querySelectorAll(selectors.join(', ')).forEach(function(el) {
    // Skip headings and empty elements
    if (!el.textContent.trim()) return;
    
    el.style.transition = 'transform 0.25s cubic-bezier(.25,.8,.25,1), background-color 0.25s ease, border-radius 0.25s ease, padding-left 0.25s ease';
    el.style.borderRadius = '6px';
    
    el.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(4px)';
      this.style.backgroundColor = 'rgba(99, 148, 231, 0.06)';
      this.style.paddingLeft = '8px';
    });
    
    el.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
      this.style.paddingLeft = '';
    });
  });

  // Links: subtle color shift + micro translate
  document.querySelectorAll('.paper-box-text a, .cv-block a').forEach(function(link) {
    link.style.transition = 'transform 0.2s ease, filter 0.2s ease';
    link.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(2px)';
      this.style.filter = 'brightness(1.15)';
    });
    link.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.filter = '';
    });
  });

  // Education/Experience items: gentle lift within the flex container
  document.querySelectorAll('.cv-block > div[style*="flex"]').forEach(function(item) {
    item.style.transition = 'transform 0.25s ease, background-color 0.25s ease';
    item.style.borderRadius = '8px';
    item.style.padding = '4px';
    
    item.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(3px)';
      this.style.backgroundColor = 'rgba(99, 148, 231, 0.04)';
    });
    item.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
    });
  });

})();
</script>
