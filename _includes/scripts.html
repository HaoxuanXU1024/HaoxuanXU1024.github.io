<script src="assets/js/main.min.js"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<script>
(function() {
  if (window.innerWidth <= 768) return;

  /* ── Click: Sparkle Burst ── */
  document.addEventListener('click', function(e) {
    var colors = ['#6394e7', '#93b5f5', '#4a7de0', '#a8c4f7', '#7da8ef'];
    for (var i = 0; i < 8; i++) {
      var s = document.createElement('div');
      s.className = 'click-spark';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      var angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5) * 0.5;
      var dist = 18 + Math.random() * 28;
      s.style.left = e.clientX + 'px';
      s.style.top  = e.clientY + 'px';
      s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(s);
      setTimeout(function() { s.remove(); }, 600);
    }
  });

  /* ── Paragraph hover (intro, research, honors) ── */
  var textSel = '.cv-block > p, .cv-block > ul > li, .cv-block > ol > li';
  document.querySelectorAll(textSel).forEach(function(el) {
    if (!el.textContent.trim() || el.closest('.paper-box')) return;
    el.style.transition = 'transform 0.3s cubic-bezier(.25,.46,.45,.94), background-color 0.3s ease, padding-left 0.3s ease';
    el.style.borderRadius = '4px';
    el.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(2px)';
      this.style.backgroundColor = 'rgba(99,148,231,0.04)';
      this.style.paddingLeft = '4px';
    });
    el.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
      this.style.paddingLeft = '';
    });
  });

  /* ── Education & Experience entries ── */
  document.querySelectorAll('.cv-block div[style*="align-items: flex-start"]').forEach(function(entry) {
    entry.style.transition = 'transform 0.3s cubic-bezier(.25,.46,.45,.94), background-color 0.3s ease';
    entry.style.borderRadius = '8px';
    entry.style.padding = '6px 8px';
    entry.style.margin = '0 -8px';
    entry.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(3px)';
      this.style.backgroundColor = 'rgba(99,148,231,0.05)';
    });
    entry.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
    });
  });

  /* ── Paper-box items (publications/projects): unified highlight ── */
  document.querySelectorAll('.paper-box').forEach(function(box) {
    box.style.transition = 'transform 0.3s cubic-bezier(.25,.46,.45,.94), background-color 0.3s ease, box-shadow 0.3s ease';
    box.style.borderRadius = '10px';
    box.style.padding = '1.5em 1em';
    box.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(3px)';
      this.style.backgroundColor = 'rgba(99,148,231,0.05)';
      this.style.boxShadow = '0 4px 16px rgba(99,148,231,0.08)';
    });
    box.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
      this.style.boxShadow = '';
    });
  });

  /* ── Links: micro shift ── */
  document.querySelectorAll('.paper-box-text a, .cv-block a').forEach(function(link) {
    link.style.transition = 'transform 0.25s ease';
    link.addEventListener('mouseenter', function() { this.style.transform = 'translateX(1px)'; });
    link.addEventListener('mouseleave', function() { this.style.transform = ''; });
  });

})();
</script>
