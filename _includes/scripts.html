<script src="assets/js/main.min.js"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<script>
(function() {
  if (window.innerWidth <= 768) return;

  /* ════════════════════════════════════════
     CLICK: Sparkle Burst
  ════════════════════════════════════════ */
  document.addEventListener('click', function(e) {
    var colors = ['#6394e7', '#93b5f5', '#4a7de0', '#a8c4f7', '#7da8ef'];
    for (var i = 0; i < 8; i++) {
      var s = document.createElement('div');
      s.className = 'click-spark';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      var angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5) * 0.5;
      var dist = 18 + Math.random() * 28;
      s.style.left = e.clientX + 'px';
      s.style.top  = e.clientY + 'px';
      s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(s);
      setTimeout(function() { s.remove(); }, 600);
    }
  });

  /* ════════════════════════════════════════
     HOVER: Apple-style subtle paragraph feedback
     - Only on intro, education, research, honors
     - NOT on paper-box items (publications/projects
       keep their own unified highlight)
  ════════════════════════════════════════ */
  var textSelectors = [
    '.cv-block > p',
    '.cv-block > ul > li',
    '.cv-block > ol > li'
  ];

  document.querySelectorAll(textSelectors.join(', ')).forEach(function(el) {
    if (!el.textContent.trim()) return;
    // Skip if inside a paper-box
    if (el.closest('.paper-box')) return;

    el.style.transition = 'transform 0.3s cubic-bezier(.25,.46,.45,.94), background-color 0.3s ease, padding-left 0.3s ease';
    el.style.borderRadius = '4px';

    el.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(2px)';
      this.style.backgroundColor = 'rgba(99, 148, 231, 0.04)';
      this.style.paddingLeft = '4px';
    });

    el.addEventListener('mouseleave', function() {
      this.style.transform = '';
      this.style.backgroundColor = '';
      this.style.paddingLeft = '';
    });
  });

  /* ── Paper-box items: subtle unified highlight ── */
  document.querySelectorAll('.paper-box').forEach(function(box) {
    box.style.transition = 'background-color 0.3s ease, border-color 0.3s ease';
    box.style.borderRadius = '10px';
    box.style.padding = '1.5em 1em';

    box.addEventListener('mouseenter', function() {
      this.style.backgroundColor = 'rgba(99, 148, 231, 0.03)';
    });

    box.addEventListener('mouseleave', function() {
      this.style.backgroundColor = '';
    });
  });

  /* ── Links: micro translate ── */
  document.querySelectorAll('.paper-box-text a, .cv-block a').forEach(function(link) {
    link.style.transition = 'transform 0.25s ease';
    link.addEventListener('mouseenter', function() {
      this.style.transform = 'translateX(1px)';
    });
    link.addEventListener('mouseleave', function() {
      this.style.transform = '';
    });
  });

})();
</script>
